name: ETF 折溢價即時通知

on:
  schedule:
    # 台北時間週一到週五 08:50 啟動（UTC 00:50），只監控 09:00–11:00
    - cron: "50 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 盤中迴圈 / test = 抓一次資料並發測試訊息"
        default: "test"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ARB_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ARB_CHAT_ID }}
          THRESHOLD: "1.0"
          STEP: "0.5"
          EXTRA_CODES: "0050,00878,0056"
          POLL_SECONDS: "30"
          END_TIME: "11:00"
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: python etf_premium_alert.py
