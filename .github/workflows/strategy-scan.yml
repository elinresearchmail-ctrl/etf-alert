name: 族群策略每日掃描

on:
  schedule:
    # 台北時間週一到週五 15:23（UTC 07:23），證交所收盤資料公布後
    - cron: "23 7 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy pyyaml yfinance cryptography
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ARB_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ARB_CHAT_ID }}
        run: python scan.py
