name: ETF 折溢價即時通知

on:
  schedule:
    # 每小時跑一次：平日 08:00–13:30 啟動就進入盤中監控（漏跑會在下一小時自動補上），其他時間只登記新朋友
    - cron: "17 * * * *"
    # 開盤前多加兩次，避免 GitHub 排程延遲
    - cron: "35 0 * * 1-5"
    - cron: "48 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 盤中監控 / test = 發測試訊息 / sync = 只登記新朋友（空白 = 自動判斷）"
        default: "test"

permissions:
  contents: write

concurrency:
  group: etf-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q cryptography requests
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ARB_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ARB_CHAT_ID }}
          THRESHOLD: "1.0"
          STEP: "0.5"
          EXTRA_CODES: "0050,00878,0056"
          # 投資海外的主動 ETF：盤中淨值用美股估算，折價多半是時差不是套利機會
          EXCLUDE_CODES: "00402A,00986A,00983A,00997A,00420A"
          POLL_SECONDS: "30"
          END_TIME: "13:30"
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            HM=$(TZ=Asia/Taipei date +%H%M)
            DOW=$(TZ=Asia/Taipei date +%u)
            if [ "$DOW" -le 5 ] && [ "$((10#$HM))" -ge 800 ] && [ "$((10#$HM))" -lt 1330 ]; then
              MODE=run
            else
              MODE=sync
            fi
          fi
          echo "mode = $MODE"
          MODE="$MODE" python etf_premium_alert.py
      - name: Save subscriber list
        if: always()
        run: |
          [ -f subscribers.enc ] || exit 0
          cp subscribers.enc /tmp/subs.enc
          git config user.name "etf-alert-bot"
          git config user.email "etf-alert-bot@users.noreply.github.com"
          git fetch -q origin main
          git reset -q --hard origin/main
          cp /tmp/subs.enc subscribers.enc
          git add subscribers.enc
          if ! git diff --cached --quiet; then
            git commit -q -m "update subscribers"
            git push -q origin HEAD:main
          fi
